name: Verification
# On demand only (the owner, 2026-11-05): gh workflow run ci.yml --ref <branch>
# The long measurements are in measure.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run strings:check
      - run: npm run interface:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e
