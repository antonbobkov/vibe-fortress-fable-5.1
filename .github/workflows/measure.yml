name: Measure
# On-demand long measurements, run on GitHub's runners instead of a local machine.
#   gh workflow run measure.yml --ref <branch> -f suite=sweep           (twenty seeds at shifts 0, 50, 100, 150 in parallel, then the verdict)
#   gh workflow run measure.yml --ref <branch> -f suite=scenario -f scenario=defence_year
#   gh workflow run measure.yml --ref <branch> -f suite=instrument      (eight shifts in parallel, then the verdict)
#   gh workflow run measure.yml --ref <branch> -f suite=defence_seeds   (eight seeds at cadences 20 to 55 in parallel, then the verdict)
#   gh workflow run measure.yml --ref <branch> -f suite=spirits         (T-554's probe: three-year seeds with and without a still making spirits)
# Results: gh run download <run-id>   (one folder per job; the verdicts are in "sweep", "instrument" and "defence")
# How to run it and read it: docs/04-implementation/tooling.md § Running tests on GitHub.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: What to measure
        type: choice
        default: sweep
        options: [sweep, instrument, three_years_main, scenario, timing, defence_seeds, spirits]
      scenario:
        description: For suite=scenario, the scenario id (its file name without .scenario.ts)
        type: string
        default: defence_year
      watch:
        description: "For suite=defence_seeds, the script's watch cadences in ticks, one job each per seed (20 is the scenario's; the verdict pools them)"
        type: string
        default: '20,25,30,35,40,45,50,55'
      shifts:
        description: "For suite=instrument or sweep, the timeline shifts to play, in ticks before the opening, one job each (empty = the suite's own, 0 to 7 and 0,50,100,150)"
        type: string
        default: ''
      probe_seeds:
        description: "For suite=spirits, the three-year seeds, quoted and comma-separated (empty = four peril-0 and four peril-2 seeds)"
        type: string
        default: ''
      snapshots:
        description: For suite=scenario and the other single runs, write the tests' snapshot pictures (SNAPSHOTS=1) to out/screenshots, uploaded with the artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sweep:
    if: inputs.suite == 'sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The longest seeds first, so the queue of 20 x N jobs ends with short ones.
        seed: [p2-3, p4-6, p0-3, p4-5, p4-1, p0-7, p2-7, p2-4, p4-4, p0-6,
               p4-3, p2-6, p0-5, p2-1, p4-2, p0-4, p0-2, p0-1, p2-2, p2-5]
        shift: ${{ fromJSON(format('[{0}]', inputs.shifts || '0,50,100,150')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Three years, seed ${{ matrix.seed }}, shift ${{ matrix.shift }}
        env:
          THREE_YEARS_SEEDS_OUT: out/shift-${{ matrix.shift }}
          THREE_YEARS_SHIFT: ${{ matrix.shift }}
        run: mkdir -p out/shift-${{ matrix.shift }} && npx vitest run -c vitest.perf.config.ts test/perf/three_years_seeds.test.ts -t "'three-years-${{ matrix.seed }}'" 2>&1 | tee out-log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        run: mv out-log.txt out/shift-${{ matrix.shift }}/three-years-${{ matrix.seed }}.log
      - name: The seed produced its result file
        run: test -f out/shift-${{ matrix.shift }}/three-years-${{ matrix.seed }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.seed }}-shift-${{ matrix.shift }}
          path: out/
          retention-days: 14

  sweep-verdict:
    if: always() && inputs.suite == 'sweep'
    needs: sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: seed-*
          path: sweeps
          merge-multiple: true
      - name: The verdict over the pooled sweeps
        env:
          THREE_YEARS_SWEEP_SAMPLES: sweeps
        run: npx vitest run -c vitest.perf.config.ts test/perf/three_years_sweep_verdict.test.ts 2>&1 | tee sweeps/verdict.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The verdict was written (no sweep is a failure, not a skip)
        if: always()
        run: test -f sweeps/verdict.md && cat sweeps/verdict.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep
          path: |
            sweeps/shift-*/*.json
            sweeps/verdict.*
          retention-days: 30

  defence-seeds:
    if: inputs.suite == 'defence_seeds'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [defence-year, defence-year-2, defence-year-3, defence-year-4,
               defence-year-5, defence-year-6, defence-year-7, defence-year-8]
        watch: ${{ fromJSON(format('[{0}]', inputs.watch || '20,25,30,35,40,45,50,55')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: defence_year, seed ${{ matrix.seed }}, cadence ${{ matrix.watch }}
        env:
          DEFENCE_SEEDS: ${{ matrix.seed }}
          DEFENCE_SEEDS_OUT: out/watch-${{ matrix.watch }}/${{ matrix.seed }}
          DEFENCE_WATCH_EVERY: ${{ matrix.watch }}
        run: mkdir -p $DEFENCE_SEEDS_OUT && npx vitest run -c vitest.perf.config.ts test/perf/defence_year_seeds.test.ts 2>&1 | tee $DEFENCE_SEEDS_OUT/${{ matrix.seed }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The seed produced its row
        run: test -s out/watch-${{ matrix.watch }}/${{ matrix.seed }}/rows.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defence-${{ matrix.seed }}-watch-${{ matrix.watch }}
          path: out/
          retention-days: 14

  defence-verdict:
    if: always() && inputs.suite == 'defence_seeds'
    needs: defence-seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: defence-defence-year*
          path: defence
          merge-multiple: true
      - name: The verdict over the pooled cadences
        env:
          DEFENCE_SEEDS_SAMPLES: defence
        run: npx vitest run -c vitest.perf.config.ts test/perf/defence_year_seeds_verdict.test.ts 2>&1 | tee defence/verdict.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The verdict was written (no rows is a failure, not a skip)
        if: always()
        run: test -f defence/verdict.md && cat defence/verdict.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defence
          path: |
            defence/watch-*/*/rows.jsonl
            defence/verdict.*
          retention-days: 30

  instrument:
    if: inputs.suite == 'instrument'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shift: ${{ fromJSON(format('[{0}]', inputs.shifts || '0,1,2,3,4,5,6,7')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Annual instrument, shift ${{ matrix.shift }}
        env:
          WILDLIFE_YEAR_OUT: out/wildlife-year-shift-${{ matrix.shift }}.json
          WILDLIFE_YEAR_SHIFT: ${{ matrix.shift }}
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/wildlife_year.test.ts 2>&1 | tee out/wildlife-year-shift-${{ matrix.shift }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The sample produced its result file
        run: test -f out/wildlife-year-shift-${{ matrix.shift }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-shift-${{ matrix.shift }}
          path: out/
          retention-days: 14

  instrument-verdict:
    if: always() && inputs.suite == 'instrument'
    needs: instrument
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: instrument-shift-*
          path: samples
          merge-multiple: true
      - name: The verdict over the pooled samples
        env:
          WILDLIFE_SAMPLES: samples
        run: npx vitest run -c vitest.perf.config.ts test/perf/wildlife_year_verdict.test.ts 2>&1 | tee samples/verdict.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The verdict was written (no sample is a failure, not a skip)
        if: always()
        run: test -f samples/verdict.md && cat samples/verdict.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument
          path: |
            samples/*.json
            samples/verdict.*
          retention-days: 30

  spirits:
    if: inputs.suite == 'spirits'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(format('[{0}]', inputs.probe_seeds || '"three-years-p0-1","three-years-p0-2","three-years-p0-3","three-years-p0-4","three-years-p2-1","three-years-p2-2","three-years-p2-5","three-years-p2-6"')) }}
        mode: [base, spirits]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Spirits probe, ${{ matrix.seed }}, ${{ matrix.mode }}
        env:
          PROBE_SEED: ${{ matrix.seed }}
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_OUT: out/${{ matrix.seed }}-${{ matrix.mode }}.json
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/t554_spirits_probe.test.ts 2>&1 | tee out/${{ matrix.seed }}-${{ matrix.mode }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spirits-${{ matrix.seed }}-${{ matrix.mode }}
          path: out/
          retention-days: 14

  single:
    if: inputs.suite != 'sweep' && inputs.suite != 'defence_seeds' && inputs.suite != 'instrument' && inputs.suite != 'spirits'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SNAPSHOTS: ${{ inputs.snapshots && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: inputs.suite == 'three_years_main'
        env:
          THREE_YEARS_OUT: out/three-years.json
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/three_years_main.test.ts 2>&1 | tee out/three-years-main.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: inputs.suite == 'timing'
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/per-system.test.ts test/perf/perf_reference.test.ts 2>&1 | tee out/timing.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: inputs.suite == 'scenario'
        run: mkdir -p out && npx vitest run test/scenarios -t "^.*${{ inputs.scenario }} \(M" 2>&1 | tee out/${{ inputs.scenario }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The run tested something
        if: always()
        run: "! sed 's/\\x1b\\[[0-9;]*m//g' out/*.log | grep -qE 'Tests +[0-9]+ skipped|No test files found'"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite == 'scenario' && inputs.scenario || inputs.suite }}
          path: out/
          retention-days: 14
