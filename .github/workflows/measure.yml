name: Measure
# On-demand long measurements, run on GitHub's runners instead of a local machine.
#   gh workflow run measure.yml --ref <branch> -f suite=sweep
#   gh workflow run measure.yml --ref <branch> -f suite=scenario -f scenario=defence_year
#   gh workflow run measure.yml --ref <branch> -f suite=instrument      (eight shifts in parallel, then the verdict)
# Results: gh run download <run-id>   (one folder per job; the sweep's summary is in "sweep-summary")
# How to run it and read it: docs/04-implementation/tooling.md § Running tests on GitHub.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: What to measure
        type: choice
        default: sweep
        options: [sweep, instrument, three_years_main, scenario, timing, defence_seeds]
      scenario:
        description: For suite=scenario, the scenario id (its file name without .scenario.ts)
        type: string
        default: defence_year
      watch:
        description: For suite=defence_seeds, the script's watch cadence in ticks (20 is the scenario's)
        type: string
        default: '20'
      shifts:
        description: For suite=instrument, the timeline shifts to play, in ticks before the opening (one job each)
        type: string
        default: '0,1,2,3,4,5,6,7'
permissions:
  contents: read
jobs:
  sweep:
    if: inputs.suite == 'sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [p0-1, p0-2, p0-3, p0-4, p0-5, p0-6, p0-7,
               p2-1, p2-2, p2-3, p2-4, p2-5, p2-6, p2-7,
               p4-1, p4-2, p4-3, p4-4, p4-5, p4-6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Three years, seed ${{ matrix.seed }}
        env:
          THREE_YEARS_SEEDS_OUT: out
        run: npx vitest run -c vitest.perf.config.ts test/perf/three_years_seeds.test.ts -t "'three-years-${{ matrix.seed }}'" 2>&1 | tee out-log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        run: mkdir -p out && mv out-log.txt out/three-years-${{ matrix.seed }}.log
      - name: The seed produced its result file
        run: test -f out/three-years-${{ matrix.seed }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.seed }}
          path: out/
          retention-days: 14

  sweep-summary:
    if: always() && inputs.suite == 'sweep'
    needs: sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: seed-*
          path: seeds
          merge-multiple: true
      - run: node scripts/ci/sweep-summary.mjs seeds | tee sweep-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-summary
          path: sweep-summary.md
          retention-days: 30

  defence-seeds:
    if: inputs.suite == 'defence_seeds'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [defence-year, defence-year-2, defence-year-3, defence-year-4,
               defence-year-5, defence-year-6, defence-year-7, defence-year-8]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: defence_year, seed ${{ matrix.seed }}
        env:
          DEFENCE_SEEDS: ${{ matrix.seed }}
          DEFENCE_SEEDS_OUT: out
          DEFENCE_WATCH_EVERY: ${{ inputs.watch }}
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/defence_year_seeds.test.ts 2>&1 | tee out/${{ matrix.seed }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.seed }}
          path: out/
          retention-days: 14

  instrument:
    if: inputs.suite == 'instrument'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shift: ${{ fromJSON(format('[{0}]', inputs.shifts)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Annual instrument, shift ${{ matrix.shift }}
        env:
          WILDLIFE_YEAR_OUT: out/wildlife-year-shift-${{ matrix.shift }}.json
          WILDLIFE_YEAR_SHIFT: ${{ matrix.shift }}
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/wildlife_year.test.ts 2>&1 | tee out/wildlife-year-shift-${{ matrix.shift }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The sample produced its result file
        run: test -f out/wildlife-year-shift-${{ matrix.shift }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-shift-${{ matrix.shift }}
          path: out/
          retention-days: 14

  instrument-verdict:
    if: always() && inputs.suite == 'instrument'
    needs: instrument
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: instrument-shift-*
          path: samples
          merge-multiple: true
      - name: The verdict over the pooled samples
        env:
          WILDLIFE_SAMPLES: samples
        run: npx vitest run -c vitest.perf.config.ts test/perf/wildlife_year_verdict.test.ts 2>&1 | tee samples/verdict.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The verdict was written (no sample is a failure, not a skip)
        if: always()
        run: test -f samples/verdict.md && cat samples/verdict.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument
          path: |
            samples/*.json
            samples/verdict.*
          retention-days: 30

  single:
    if: inputs.suite != 'sweep' && inputs.suite != 'defence_seeds' && inputs.suite != 'instrument'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: inputs.suite == 'three_years_main'
        env:
          THREE_YEARS_OUT: out/three-years.json
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/three_years_main.test.ts 2>&1 | tee out/three-years-main.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: inputs.suite == 'timing'
        run: mkdir -p out && npx vitest run -c vitest.perf.config.ts test/perf/per-system.test.ts test/perf/perf_reference.test.ts 2>&1 | tee out/timing.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: inputs.suite == 'scenario'
        run: mkdir -p out && npx vitest run test/scenarios -t "^.*${{ inputs.scenario }} \(M" 2>&1 | tee out/${{ inputs.scenario }}.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: The run tested something
        if: always()
        run: "! sed 's/\\x1b\\[[0-9;]*m//g' out/*.log | grep -qE 'Tests +[0-9]+ skipped|No test files found'"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.suite == 'scenario' && inputs.scenario || inputs.suite }}
          path: out/
          retention-days: 14
